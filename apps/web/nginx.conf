server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proof-of-delivery photos and signatures go through the API.
    client_max_body_size 10m;

    # API: forwarded to the NestJS container on the Compose network (never "localhost" here).
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /dispatcher/..., /driver/trips/...) all serve the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
